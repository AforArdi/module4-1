<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task</title>
    <link rel="stylesheet" href="css/style.css">
<body>
    <header>
        <nav class="center">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <article id="language">
            <section>
                <h2 class="main-image-caption">Welcome!</h2>
                <figure>
                    <img id="main-image" src="images/main-image.jpg" alt="nothing">
                    <figcaption class="main-image-caption">Code Your Career</figcaption>
                </figure>

                <fieldset>
                    <legend class="center-blue">Choose Favorite Language</legend>
                    
                    <input type="radio" name="language" id="html-css">
                    <label for="html-css">HTML CSS</label>

                    <input type="radio" name="language" id="javascript">
                    <label for="javascript">JavaScript</label>

                    <input type="radio" name="language" id="python">
                    <label for="python">Python</label>
                </fieldset>

                <fieldset>
                    <legend class="center-blue">Where're you learning from</legend>

                    <input type="checkbox" name="YouTube" id="youtube">
                    <label for="youtube">YouTube</label>

                    <input type="checkbox" name="Self" id="self">
                    <label for="self">Self</label>

                    <input type="checkbox" name="phero" id="phero">
                    <label for="phero">Programming Hero</label>
                </fieldset>
            </section>

            <section id="details">
                <form action="#">
                    <label for="name">Name</label>
                    <input type="text" id="name" placeholder="Type your name">

                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Type your email">
                </form>
            </section>

            <section>
                <h3 class="blue-text">Feedback</h3>
                <textarea cols="80" rows="10" name="feedback" id="feedback" placeholder="Your Feedback (max: 80 character)"></textarea>
            </section>
        </article>
    </main>
    <footer>
        <p class="center"><small>&copy; 2026 Code Your Career</small></p>
    </footer>
</body>
</html>
